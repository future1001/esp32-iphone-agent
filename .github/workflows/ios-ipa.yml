# Build an UNSIGNED .ipa of the iPhone app on a GitHub-hosted macOS runner, so no Xcode is
# needed on any local machine. Sign and install it with a sideloading tool (i4Tools / Sideloadly /
# AltStore) using your own Apple ID.
#
# Trigger: Actions tab -> "Build unsigned IPA" -> Run workflow, or any push to main touching ios/.
name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'prompts/**'
      - '.github/workflows/ios-ipa.yml'

jobs:
  ipa:
    name: macos-26 unsigned device build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Local signing config - unsigned, no team, no paid-only entitlements
        working-directory: ios
        run: |
          cat > Config/Local.xcconfig <<'EOF'
          // Generated by CI. Unsigned build: no team, no entitlements.
          DEVELOPMENT_TEAM =
          IA_BUNDLE_ID = com.future.esp32agent
          IA_ENTITLEMENTS =
          IA_WIDGET_ENTITLEMENTS =
          IA_PRESET_BASE_URL =
          IA_PRESET_MODEL =
          IA_PRESET_KEY =
          EOF
          echo "--- Config/Local.xcconfig ---"
          cat Config/Local.xcconfig

      - name: Build for a real device, unsigned
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project IPhoneAgent.xcodeproj \
            -scheme IPhoneAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload/ into an .ipa
        working-directory: ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app bundle: $APP"
          test -n "$APP"
          echo "--- nested bundles ---"
          find "$APP" -name '*.appex' -maxdepth 2
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ESP32Agent-unsigned.ipa
          ls -lh ESP32Agent-unsigned.ipa
          unzip -l ESP32Agent-unsigned.ipa | head -12

      - name: Upload the ipa
        uses: actions/upload-artifact@v4
        with:
          name: ESP32Agent-unsigned-ipa
          path: ios/ESP32Agent-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
